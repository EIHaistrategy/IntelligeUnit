<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Transformation &amp; Adoption Map · Mappe a quadranti</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%227%22%20fill=%22%23101D35%22/%3E%3Cpath%20d=%22M16%205v22M5%2016h22%22%20stroke=%22%23fff%22%20stroke-opacity=%22.35%22%20stroke-width=%221.4%22/%3E%3Ccircle%20cx=%229.5%22%20cy=%2221.5%22%20r=%222.2%22%20fill=%22%23fff%22%20fill-opacity=%22.7%22/%3E%3Ccircle%20cx=%2211.5%22%20cy=%2210.5%22%20r=%222.2%22%20fill=%22%23fff%22%20fill-opacity=%22.7%22/%3E%3Ccircle%20cx=%2221%22%20cy=%2222%22%20r=%222.2%22%20fill=%22%23fff%22%20fill-opacity=%22.7%22/%3E%3Ccircle%20cx=%2223.5%22%20cy=%229%22%20r=%223.6%22%20fill=%22%2335D4C0%22/%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .wrap { max-width: 1320px; }
  .mhead h1 { font-family: var(--display); font-size: clamp(2rem, 3.4vw, 2.8rem); margin: 0; }
  .mhead p { margin: 8px 0 0; color: var(--ink-2); font-size: 1.05rem; }
  .msec { margin-top: 34px; }
  /* al telefono grafici e tabelle restano dentro lo schermo */
  .msec .card { min-width: 0; overflow-x: auto; } .msec .chart svg { max-width: 100%; height: auto; }
  .msec > h2 { font-size: 1.6rem; margin-bottom: 4px; }
  .msec > .q { color: var(--ink-3); font-weight: 600; margin: 0 0 6px; }
  .msec > .lede { margin-bottom: 16px; }
  .qlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .qlist li { padding: 12px 14px; border-radius: var(--radius-sm); background: var(--sunken); }
  .qlist .qn { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .qlist .qn b { color: var(--navy-deep); }
  .qlist .qn span { font-family: var(--display); font-size: 1.4rem; color: var(--navy-deep); }
  .qlist p { margin: 4px 0 0; font-size: .9rem; color: var(--ink-2); }
  .qlist .who { margin-top: 6px; font-size: .86rem; color: var(--ink); }
  .minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .mini { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px; }
  .mini-h { font-weight: 700; color: var(--navy-deep); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .chart svg { width: 100%; height: auto; }
  .mini-f { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .84rem; color: var(--ink-2); margin-top: 4px; }
  .mini-f b { color: var(--navy-deep); }
  .dimhead { display: flex; align-items: center; margin-bottom: 12px; }
  .dimhead h3 { margin: 0; font-size: 1.15rem; }
</style>
</head>
<body>
<div class="topbar"><span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/><path d="M16 5v22M5 16h22" stroke="#fff" stroke-opacity=".25" stroke-width="1.2"/><circle cx="9.5" cy="21.5" r="2" fill="#fff" fill-opacity=".6"/><circle cx="11.5" cy="10.5" r="2" fill="#fff" fill-opacity=".6"/><circle cx="21" cy="22" r="2" fill="#fff" fill-opacity=".6"/><circle cx="19" cy="13.5" r="1.6" fill="#fff" fill-opacity=".6"/><circle cx="23.5" cy="9" r="3.2" fill="#35D4C0"/></svg><span class="bname">AITO Map<small>AI Transformation &amp; Adoption Map</small></span></span><span class="sub" id="ttl">Mappe a quadranti</span></div>
<div class="wrap" id="app"><p class="muted">Caricamento…</p></div>
<script type="module">
import { api, esc, $, fmtScore, demoBar } from '/static/js/ui.js';
import { quadrantMap } from '/static/js/charts.js';
import { gapMapHtml, peerMapHtml } from '/static/js/maps.js';
const base = location.pathname.split('/').pop();
const params = new URLSearchParams(location.search);
// pagina riservata al team ELIS e non proiettata (decisione del 21/10/2026): i nomi si vedono di default, si possono nascondere
let showNames = params.get('nomi') !== '0';
// prima le mappe di community; le mappe per azienda si aprono con un pulsante
let showCompanies = params.get('aziende') === '1';
const keep = () => history.replaceState(null, '', `?${params}`);

let M;
try { M = await api(`/api/admin/maps/${base}`); }
catch (e) { $('#app').innerHTML = `<div class="card"><p>${esc(e.message)}. Accedi prima dalla <a href="/admin">console ELIS</a>.</p></div>`; throw e; }
document.title = `${M.def.name} · mappe a quadranti`;

const DECIDE = { HH: 'Scalare pratiche, documentare evidenze e contribuire alla community.', HL: 'Migliorare selettivamente usando pratiche dei peer, senza sovrainvestire.',
  LH: 'Rafforzare la capacità: essere sopra la mediana non significa essere consolidati.', LL: 'Attivare priorità, commitment e confronto con i peer.' };
const POS = { HH: 'TR', HL: 'BR', LH: 'TL', LL: 'BL' };

function draw() {
  if (!M.available) { $('#app').innerHTML = `<div class="card"><h1>${esc(M.def.name)}</h1><p>${esc(M.message)}</p></div>`; return; }
  const T = M.thresholds;
  const qnames = M.quadrantNames[M.namesInUse], alt = M.quadrantNames.alternativi;
  const whereQuads = Object.fromEntries(Object.entries(POS).map(([k, p]) => [p, qnames[k]]));

  // ---- 10.2 Dove intervenire: la mappa è per azienda (un punto per dimensione). Qui: quadro d'insieme e una piccola mappa per azienda.
  const dimsOk = M.dims.filter((d) => d.where.length);
  const companies = new Map();
  for (const d of dimsOk) for (const p of d.where) {
    if (!companies.has(p.company)) companies.set(p.company, { id: p.company, name: p.name, pts: [] });
    companies.get(p.company).pts.push({ ...p, dim: d.dimension, dimName: d.name });
  }
  const list = [...companies.values()].sort((a, b) => a.name.localeCompare(b.name, 'it'));
  const anon = new Map([...companies.keys()].sort((a, b) => a - b).map((id, i) => [id, `Azienda ${i + 1}`]));
  const lim = Math.ceil((Math.max(20, ...dimsOk.flatMap((d) => d.where.map((p) => Math.abs(p.delta)))) + 5) / 10) * 10;
  const whereHtml = !dimsOk.length
    ? `<div class="banner warn">Non disponibile: servono almeno ${M.minN} aziende con la dimensione completa.</div>`
    : `<div class="card"><h3 style="margin-bottom:12px">Aziende per quadrante</h3><div class="tablewrap"><table><thead><tr><th>Quadrante</th><th>Che cosa fare</th>${dimsOk.map((d) => `<th class="num"><span class="dim-letter">${d.dimension}</span></th>`).join('')}</tr></thead><tbody>
        ${['HH', 'HL', 'LH', 'LL'].map((k) => `<tr><td><b>${esc(qnames[k])}</b><div class="small muted">alternativo: ${esc(alt[k])}</div></td><td class="small">${esc(DECIDE[k])}</td>
          ${dimsOk.map((d) => { const n = d.where.filter((p) => p.key === k); return `<td class="num"><span class="kpi" style="font-size:1.4rem">${n.length}</span>${showNames && n.length ? `<div class="small" style="text-align:left;max-width:220px;margin-left:auto">${n.map((p) => esc(p.name)).join(', ')}</div>` : ''}</td>`; }).join('')}</tr>`).join('')}
        </tbody></table></div>
        <p class="small muted" style="margin-top:10px">Mediane della community: ${dimsOk.map((d) => `${d.dimension} ${fmtScore(d.stats.median)}`).join(', ')}. Su una sola dimensione la distanza dalla mediana cresce insieme allo score, per questo la mappa si legge azienda per azienda, confrontando le dimensioni tra loro.</p></div>
      <div class="minis">${list.map((c) => `<div class="mini"><div class="mini-h">${esc(showNames ? c.name : anon.get(c.id))}</div>
        <div class="chart">${quadrantMap({ compact: true, w: 300, h: 230, points: c.pts.map((p) => ({ x: p.score, y: p.delta, letter: p.dim, title: `${p.dim} ${p.dimName}: score ${fmtScore(p.score)}, ${p.delta >= 0 ? '+' : ''}${fmtScore(p.delta)} dalla mediana` })),
          quads: whereQuads, x: { min: 0, max: 100, t: T.where.score, label: '' }, y: { min: -lim, max: lim, t: 0, label: '', fmt: (v) => (v > 0 ? `+${v}` : String(v)) } })}</div>
        <div class="mini-f">${c.pts.map((p) => `<span><b>${p.dim}</b> ${esc(p.quadrant)}</span>`).join('')}</div></div>`).join('')}</div>`;

  const gapHtml = gapMapHtml(M), peerHtml = peerMapHtml(M, { showNames });
  $('#app').innerHTML = `
    ${M.preview ? (demoBar(), '') : ''}
    <div class="mhead"><h1>${esc(M.def.name)}: mappe a quadranti</h1>
      <p>Fonte: ${esc(M.version)}, ${M.nCompanies} aziende. Le soglie (${T.where.score} e 0; ${Math.round(T.community.fondShare * 100)}% e ${T.community.iqr} punti; ${T.peer.need} e ${T.peer.contrib}) sono ipotesi del pilot da validare con l'Intelligence Unit.</p></div>
    <section class="msec"><h2>Il bisogno è individuale o condiviso?</h2><p class="q">Gap della community</p>
      <p class="lede">Ogni punto è una dimensione. Orizzontale: quante aziende sono ancora in fascia Fondativa. Verticale: quanto le aziende sono diverse tra loro. Molte aziende indietro e simili tra loro suggeriscono un'azione comune; aziende molto diverse chiedono percorsi differenziati.</p>
      ${gapHtml}</section>
    <section class="msec"><h2>Con chi accelerare?</h2><p class="q">Peer matching</p>
      <p class="lede">Ogni punto è una dimensione. Orizzontale: quante aziende l'hanno scelta come priorità nel commitment. Verticale: quante aziende potrebbero portare la propria esperienza. Dove entrambi sono alti conviene attivare la rete.</p>
      ${peerHtml}</section>
    <section class="msec" aria-labelledby="dove-t"><h2 id="dove-t">Dove intervenire, azienda per azienda</h2><p class="q">Posizionamento azienda–peer</p>
      <p class="lede">Ogni piccola mappa è un'azienda e ogni punto una dimensione della sessione. Orizzontale: lo score della dimensione. Verticale: quanto è sopra o sotto la mediana delle altre aziende (l'azienda stessa è esclusa dal calcolo). È la mappa del report aziendale, vista per tutte le aziende insieme.</p>
      <div class="row" style="align-items:center;gap:16px;margin-bottom:14px">
        <button type="button" id="cmp" class="${showCompanies ? 'ghost' : 'primary'}" aria-expanded="${showCompanies}" aria-controls="cmp-box">${showCompanies ? 'Nascondi le mappe per azienda' : 'Mostra le mappe per azienda'}</button>
        <label class="small"><input type="checkbox" id="names" ${showNames ? 'checked' : ''}> mostra i nomi delle aziende <span class="muted">(vale anche per il peer matching)</span></label></div>
      <div id="cmp-box" ${showCompanies ? '' : 'hidden'}>${showNames ? '' : '<p class="small muted">I nomi sono nascosti: ogni azienda compare come «Azienda 1», «Azienda 2»…</p>'}${whereHtml}</div></section>`;
  $('#cmp').onclick = () => { showCompanies = !showCompanies; params.set('aziende', showCompanies ? '1' : '0'); keep(); draw(); $('#cmp').focus(); };
  $('#names').onchange = (e) => { showNames = e.target.checked; params.set('nomi', showNames ? '1' : '0'); keep(); draw(); $('#names').focus(); };
}
draw();
</script>
</body>
</html>
