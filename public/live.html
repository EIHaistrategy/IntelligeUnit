<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Transformation &amp; Adoption Map · Benchmark live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%227%22%20fill=%22%23101D35%22/%3E%3Cpath%20d=%22M16%205v22M5%2016h22%22%20stroke=%22%23fff%22%20stroke-opacity=%22.35%22%20stroke-width=%221.4%22/%3E%3Ccircle%20cx=%229.5%22%20cy=%2221.5%22%20r=%222.2%22%20fill=%22%23fff%22%20fill-opacity=%22.7%22/%3E%3Ccircle%20cx=%2211.5%22%20cy=%2210.5%22%20r=%222.2%22%20fill=%22%23fff%22%20fill-opacity=%22.7%22/%3E%3Ccircle%20cx=%2221%22%20cy=%2222%22%20r=%222.2%22%20fill=%22%23fff%22%20fill-opacity=%22.7%22/%3E%3Ccircle%20cx=%2223.5%22%20cy=%229%22%20r=%223.6%22%20fill=%22%2335D4C0%22/%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  html { font-size: clamp(16px, 1.15vw, 22px); }
  .wrap { max-width: 1560px; padding-top: 28px; }
  .live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3DDC84; margin-right: 8px; box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: ping 2s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(61,220,132,.55); } 70% { box-shadow: 0 0 0 8px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }
  .lhead { display: grid; grid-template-columns: 1fr minmax(320px, 520px); gap: 16px 40px; align-items: end; margin-bottom: 22px; }
  .lhead h1 { font-family: var(--display); font-size: clamp(2.2rem, 3.6vw, 3.2rem); margin: 0; line-height: 1; }
  .lhead p { margin: 8px 0 0; font-size: 1.12rem; color: var(--ink-2); }
  .tally { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 18px; }
  .tally > div { padding: 16px 22px; border-left: 1px solid var(--line-2); }
  .tally > div:first-child { border-left: 0; }
  .tally .v { font-family: var(--display); font-size: 2.6rem; line-height: 1; color: var(--navy-deep); font-variant-numeric: tabular-nums lining-nums; }
  .tally .l { font-size: .95rem; color: var(--ink-2); font-weight: 600; margin-top: 6px; }
  .tally .l em { font-style: normal; color: var(--ink-3); font-weight: 400; }
  .dimcard h2 { font-size: 1.45rem; display: flex; align-items: center; }
  .hero { font-family: var(--display); font-size: 4.2rem; font-weight: 600; color: var(--navy-deep); font-variant-numeric: tabular-nums lining-nums; line-height: .95; }
  .herorow { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin: 6px 0 14px; }
  .herorow .ink2 { padding-bottom: 6px; line-height: 1.35; }
  .strip svg { width: 100%; height: 46px; display: block; }
  .zlab { display: flex; font-size: .84rem; color: var(--ink-3); font-weight: 600; margin-top: 4px; }
  .zlab span { padding-left: 6px; border-left: 1.5px solid #9AA6B6; }
  .zlab b { color: var(--ink-2); margin-right: 4px; }
  .zlab span:first-child { border-left: 0; padding-left: 0; }
  .waiting { text-align: center; padding: 56px 20px; }
  .waiting .big { font-family: var(--display); font-size: 5.5rem; line-height: 1; color: var(--navy-deep); font-variant-numeric: tabular-nums lining-nums; }
  .waiting .big span { color: var(--ink-3); }
  .meter { display: grid; gap: 6px; max-width: 520px; margin: 22px auto; }
  .meter > div { height: 14px; border-radius: 3px; background: var(--line-2); }
  .meter > div.on { background: var(--navy); }
  .b-FOND { background: var(--band-fond); color: #3B1F05 !important; } .b-COST { background: var(--band-cost); color: #3A2D07 !important; } .b-CONS { background: var(--band-cons); color: #fff; }
  .itemcard h3 { margin: 0; font-size: 1.08rem; }
  .itemcard .seg { margin-top: 12px; height: 38px; }
  .itemcard .seg > div { font-size: .9rem; }
  @media (max-width: 900px) { .lhead { grid-template-columns: 1fr; } .tally { grid-template-columns: repeat(2, minmax(0,1fr)); } .tally > div:nth-child(3) { border-left: 0; } .tally > div:nth-child(n+3) { border-top: 1px solid var(--line-2); } .hero { font-size: 3.2rem; } }
</style>
</head>
<body>
<div class="topbar"><span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/><path d="M16 5v22M5 16h22" stroke="#fff" stroke-opacity=".25" stroke-width="1.2"/><circle cx="9.5" cy="21.5" r="2" fill="#fff" fill-opacity=".6"/><circle cx="11.5" cy="10.5" r="2" fill="#fff" fill-opacity=".6"/><circle cx="21" cy="22" r="2" fill="#fff" fill-opacity=".6"/><circle cx="19" cy="13.5" r="1.6" fill="#fff" fill-opacity=".6"/><circle cx="23.5" cy="9" r="3.2" fill="#35D4C0"/></svg><span class="bname">AITO Map<small>AI Transformation &amp; Adoption Map</small></span></span><span class="sub" id="ttl">Benchmark in tempo reale</span><span class="spacer"></span>
  <span class="small" id="upd" style="color:#fff;white-space:nowrap"></span></div>
<div class="wrap" id="app"><p class="muted">Caricamento…</p></div>
<script type="module">
import { api, esc, $, fmtScore, phaseChips, demoBar } from '/static/js/ui.js';
const sid = location.pathname.split('/').pop();
const params = new URLSearchParams(location.search);

// fascia 0–100 con le tre zone del pilot (Fondativa < 44, In costruzione 44–69, Consolidata ≥ 70), Q1–Q3 e mediana
function strip(st) {
  const X = (v) => (v / 100) * 1000;
  const zones = [[0, 44, '#FCEBDD', 'Fondativa'], [44, 70, '#F5EDD3', 'In costruzione'], [70, 100, '#E1F2E8', 'Consolidata']];
  let g = zones.map(([a, b, c]) => `<rect x="${X(a)}" y="8" width="${X(b) - X(a)}" height="30" fill="${c}"/>`).join('');
  for (const t of [44, 70]) g += `<line x1="${X(t)}" y1="4" x2="${X(t)}" y2="42" stroke="#9AA6B6" stroke-width="1.5"/>`;
  g += `<rect x="${X(st.q1)}" y="13" width="${Math.max(4, X(st.q3) - X(st.q1))}" height="18" rx="3" fill="#2C97A6"><title>1°–3° quartile: ${fmtScore(st.q1)}–${fmtScore(st.q3)}</title></rect>`;
  g += `<line x1="${X(st.median)}" y1="2" x2="${X(st.median)}" y2="44" stroke="#101D35" stroke-width="5" stroke-linecap="round"><title>Mediana: ${fmtScore(st.median)}</title></line>`;
  const lab = zones.map(([a, b, , n]) => `<span style="width:${b - a}%"><b>${a}</b> ${n}</span>`).join('');
  return `<div class="strip"><svg viewBox="0 0 1000 46" preserveAspectRatio="none" role="img" aria-label="Mediana ${fmtScore(st.median)}, metà centrale delle aziende tra ${fmtScore(st.q1)} e ${fmtScore(st.q3)}">${g}</svg><div class="zlab" aria-hidden="true">${lab}</div></div>`;
}
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

async function draw() {
  let D;
  try { D = await api(`/api/admin/live/${sid}`); }
  catch (e) { $('#app').innerHTML = `<div class="card"><p>${esc(e.message)} — accedi prima da <a href="/admin">/admin</a>.</p></div>`; return; }
  const P = D.progress;
  $('#ttl').textContent = `${D.session.title} · benchmark in tempo reale`;
  document.title = `${D.def.name} · benchmark live`;
  $('#upd').innerHTML = `<span class="live-dot"></span>aggiornato alle ${new Date(D.updatedAt).toLocaleTimeString('it-IT')}`;
  const ready = P.benchmarkN >= P.minN;
  $('#app').innerHTML = `
    ${D.preview ? (demoBar(), '') : ''}
    <div class="lhead"><div><h1>${esc(D.def.name)}</h1><p>Come si posiziona la community, in tempo reale</p></div>${phaseChips(D.session.phase)}</div>
    <div class="tally">
      <div><div class="v">${P.participants}</div><div class="l">partecipanti in sala <em>· ${P.submitted} hanno inviato</em></div></div>
      <div><div class="v">${P.active}</div><div class="l">aziende al lavoro</div></div>
      <div><div class="v">${P.consolidatedHere}</div><div class="l">aziende che hanno consolidato</div></div>
      <div><div class="v">${P.benchmarkN}</div><div class="l">aziende nel benchmark <em>· ${P.benchmarkN >= P.stableN ? 'stabile' : P.benchmarkN >= P.minN ? 'indicativo' : `ne servono ${P.minN}`}</em></div></div>
    </div>
    ${!ready ? `<div class="card waiting"><div class="big">${P.benchmarkN}<span> / ${P.minN}</span></div>
        <p style="font-size:1.25rem;margin-top:14px">Il benchmark compare quando almeno <b>${P.minN} aziende</b> hanno consolidato e dato il consenso.</p>
        <div class="meter" style="grid-template-columns:repeat(${P.minN},1fr)">${Array.from({ length: P.minN }, (_, i) => `<div class="${i < P.benchmarkN ? 'on' : ''}"></div>`).join('')}</div>
        <p class="muted">Sotto questa soglia le singole aziende sarebbero riconoscibili (§9.1).</p></div>` : `
    <div class="grid c2">${D.dims.map((d) => `<div class="card dimcard"><h2><span class="dim-letter">${d.dimension}</span>${esc(d.name)}</h2>
      ${d.stats.available ? `<div class="herorow"><div class="hero">${fmtScore(d.stats.median)}</div><div class="ink2">mediana della community<br>metà centrale tra ${fmtScore(d.stats.q1)} e ${fmtScore(d.stats.q3)} · N=${d.stats.n} · ${esc(d.stats.label)}</div></div>
        ${strip(d.stats)}
        <h4 style="margin-top:18px">Aziende per fascia</h4>
        <div class="seg">${d.bands.filter((b) => b.count).map((b) => `<div class="b-${b.id}" style="flex:${b.count}" title="${esc(b.name)}: ${b.count} aziende">${b.count}</div>`).join('')}</div>
        <div class="legend" style="margin-top:8px">${d.bands.map((b) => `<span><i class="b-${b.id}"></i>${esc(b.name)} ${pct(b.count, d.stats.n)}%</span>`).join('')}</div>
        ${d.gap?.available ? `<p style="margin:14px 0 0">Distanza tra primo e terzo quartile <b>${fmtScore(d.gap.iqr)} punti</b> <span class="tag navy" style="margin-left:6px">${esc(d.gap.quadrant)}</span></p>` : ''}`
        : `<div class="banner warn">Non ancora disponibile: N = ${d.stats.n}.</div>`}</div>`).join('')}</div>
    <div class="row between" style="margin:28px 0 12px"><h2 style="margin:0">Capacità della sessione</h2><div class="legend">${[1, 2, 3, 4, 5].map((l) => `<span><i class="l${l}"></i>Livello ${l}</span>`).join('')}</div></div>
    <div class="grid c2">${D.items.map((it) => `<div class="card itemcard"><div class="row between"><h3>${esc(it.itemId)} · ${esc(it.title)}</h3><span class="small muted">${it.dist.available ? `mediana ${fmtScore(it.stats.median)} · N=${it.stats.n}` : ''}</span></div>
      ${it.dist.available ? `<div class="seg">${it.dist.levels.filter((l) => l.count).map((l) => `<div class="l${l.level}" style="flex:${l.count}" title="Livello ${l.level}: ${l.count} aziende">${l.count}</div>`).join('')}</div>
        <p class="small muted" style="margin:8px 0 0">${it.dist.levels.filter((l) => l.subDist).map((l) => `Liv. ${l.level}: ${l.subDist.map((s) => `${l.level}${s.key} ${s.count}`).join(' · ')}`).join(' — ') || 'Varianti dei livelli non mostrate: nessuna raggiunge 5 aziende.'}${it.nd ? ` · ${it.nd} aziende con N.D.` : ''}</p>`
        : `<div class="banner warn" style="margin-top:8px">Non ancora disponibile: N = ${it.dist.n}.</div>`}</div>`).join('')}</div>`}
    <p class="small muted" style="margin-top:20px;max-width:none">Dati anonimi e aggregati, aggiornati ogni 5 secondi man mano che le aziende consolidano. Non sono ancora la versione ufficiale: il benchmark si congela a fine sessione e i report usano quella versione (§9).${D.frozen ? ` Ultima versione congelata: ${esc(D.frozen.label)} (N=${D.frozen.n_companies}).` : ''}</p>`;
}
draw();
setInterval(draw, 5000);
</script>
</body>
</html>
