<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AITO Map · Plenaria</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231F3864%22/%3E%3Cg fill=%22%23C9A84C%22%3E%3Crect x=%226%22 y=%2220%22 width=%223.4%22 height=%226%22 rx=%22.8%22/%3E%3Crect x=%2210.4%22 y=%2217%22 width=%223.4%22 height=%229%22 rx=%22.8%22/%3E%3Crect x=%2214.8%22 y=%2214%22 width=%223.4%22 height=%2212%22 rx=%22.8%22/%3E%3Crect x=%2219.2%22 y=%2210%22 width=%223.4%22 height=%2216%22 rx=%22.8%22/%3E%3Crect x=%2223.6%22 y=%226%22 width=%223.4%22 height=%2220%22 rx=%22.8%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/serif-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  body { font-size: 17px; }
  .wrap { max-width: 1320px; }
  .pl h1 { font-family: var(--display); font-size: clamp(2rem, 3.4vw, 3rem); margin: 0; }
  .plhead { margin-bottom: 22px; } .plhead p { margin: 8px 0 0; color: var(--ink-2); font-size: 1.08rem; }
  .stack-bar { display: flex; height: 40px; gap: 2px; border-radius: 6px; overflow: hidden; margin-top: 12px; }
  .stack-bar div { display: grid; place-items: center; font-weight: 700; font-size: .92rem; min-width: 0; }
  .pl .kpi { font-size: 3rem; }
</style>
</head>
<body>
<div class="topbar"><span class="brand"><svg viewBox="0 0 26 22" aria-hidden="true"><rect x="0" y="16" width="4" height="6" rx="1" fill="#C9A84C" fill-opacity=".45"/><rect x="5.5" y="12" width="4" height="10" rx="1" fill="#C9A84C" fill-opacity=".6"/><rect x="11" y="8" width="4" height="14" rx="1" fill="#C9A84C" fill-opacity=".75"/><rect x="16.5" y="4" width="4" height="18" rx="1" fill="#C9A84C" fill-opacity=".9"/><rect x="22" y="0" width="4" height="22" rx="1" fill="#C9A84C"/></svg>AITO Map</span><span class="sub">Benchmark della community · anonimo e aggregato</span><span class="spacer"></span></div>
<div class="wrap pl" id="app"><p class="muted">Caricamento…</p></div>
<script type="module">
import { api, esc, $, fmtScore } from '/static/js/ui.js';
import { gapMapHtml, peerMapHtml } from '/static/js/maps.js';
const base = location.pathname.split('/').pop();
const params = new URLSearchParams(location.search);
const { scoring: SC } = await api('/api/instrument');
let P;
try { P = await api(`/api/admin/plenaria/${base}`); }
catch (e) { $('#app').innerHTML = `<div class="card"><p>${esc(e.message)} — accedi prima da <a href="/admin">/admin</a>.</p></div>`; throw e; }
if (!P.available) { $('#app').innerHTML = `<div class="card"><h1>${esc(P.def.name)}</h1><p>${esc(P.message)}</p></div>`; }
else {
  const na = (s) => `<div class="banner warn">Non disponibile: N = ${s.n}. Il benchmark si mostra da ${SC.benchmark.minN} aziende in su, per evitare che le singole aziende siano riconoscibili.</div>`;
  $('#app').innerHTML = `
    ${P.preview ? '<div class="banner preview">Ambiente di prova: dati dimostrativi, non sono dati ufficiali</div>' : ''}
    <div class="plhead"><h1>${esc(P.def.name)}</h1>
      <p>Come si posiziona la community. Fonte: <b>${esc(P.version)}</b>, ${P.nCompanies} aziende con dati, nessun nome: solo distribuzioni.</p></div>
    <div class="grid c2">${P.dims.map((d) => `<div class="card"><h2 style="display:flex;align-items:center"><span class="dim-letter">${d.dimension}</span>${esc(d.name)}</h2>
      ${d.stats.available ? `<div class="kpi">${fmtScore(d.stats.median)} <small>mediana · 1°–3° quartile ${fmtScore(d.stats.q1)}–${fmtScore(d.stats.q3)} · N=${d.stats.n} · ${d.stats.label}</small></div>
        ${d.gap.available ? `<p style="margin-top:8px">In fascia Fondativa: <b>${Math.round(d.gap.fondShare * 100)}%</b> delle aziende · eterogeneità (IQR) <b>${fmtScore(d.gap.iqr)}</b> punti → <span class="tag navy">${esc(d.gap.quadrant)}</span></p>` : ''}` : na(d.stats)}</div>`).join('')}</div>
    <h2 style="margin:28px 0 12px">Capacità della sessione</h2>${P.items.map((it) => `<div class="card"><h3>${esc(it.itemId)} · ${esc(it.title)}</h3>
      ${it.dist.available ? `<div class="stack-bar">${it.dist.levels.filter((l) => l.count).map((l) => `<div class="l${l.level}" style="flex:${l.count}" title="Livello ${l.level}: ${l.count} aziende">${l.count}</div>`).join('')}</div>
        <p class="small muted" style="margin-top:6px">${it.dist.levels.filter((l) => l.subDist).map((l) => `Liv. ${l.level}: ${l.subDist.map((s) => `${l.level}${s.key} ${s.count}`).join(' · ')}`).join(' — ') || 'Sotto-livelli aggregati al livello (regola dei 5).'}
        · mediana ${fmtScore(it.stats.median)} · N=${it.stats.n}</p>` : na(it.dist)}</div>`).join('')}
    <div class="legend">${[1, 2, 3, 4, 5].map((l) => `<span><i class="l${l}"></i>Livello ${l}</span>`).join('')}</div>`;
  // lettura di community (§10.3, §10.4): solo dati aggregati, si può proiettare
  try {
    const M = await api(`/api/admin/maps/${base}`);
    if (M.available) $('#app').insertAdjacentHTML('beforeend', `
      <h2 style="margin:36px 0 4px">Il bisogno è individuale o condiviso?</h2>
      <p class="ink2" style="margin-bottom:14px">Ogni punto è una dimensione: quante aziende sono ancora in fascia Fondativa e quanto sono diverse tra loro.</p>${gapMapHtml(M)}
      <h2 style="margin:28px 0 4px">Con chi accelerare?</h2>
      <p class="ink2" style="margin-bottom:14px">Ogni punto è una dimensione: quante aziende l'hanno scelta come priorità e quante potrebbero portare la propria esperienza.</p>${peerMapHtml(M)}
      <p class="small muted"><a href="/mappe/${base}">Tutte le mappe della sessione</a>, compresa la vista per azienda (solo console ELIS).</p>`);
  } catch { /* mappe non disponibili: la plenaria resta valida */ }
}
</script>
</body>
</html>
