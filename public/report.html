<style>
  .rep { max-width: 1120px; }
  .rep .card > h2 { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .secnum { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--gold); color: var(--gold-ink); font-family: var(--font); font-size: .9rem; font-weight: 700; flex: none; }
  .cover { background: var(--navy-deep); color: #fff; border-radius: var(--radius); padding: 34px 36px 28px; margin-bottom: 18px; position: relative; overflow: hidden; box-shadow: inset 0 -5px 0 var(--gold); }
  .cover::after { content: ""; position: absolute; right: 36px; top: 34px; width: 120px; height: 96px; opacity: .9;
    background: linear-gradient(var(--gold),var(--gold)) 0 100%/18px 20% no-repeat, linear-gradient(var(--gold),var(--gold)) 25.5px 100%/18px 40% no-repeat, linear-gradient(var(--gold),var(--gold)) 51px 100%/18px 60% no-repeat, linear-gradient(var(--gold),var(--gold)) 76.5px 100%/18px 80% no-repeat, linear-gradient(var(--gold),var(--gold)) 102px 100%/18px 100% no-repeat; }
  .cover h1 { color: #fff; font-family: var(--display); font-size: clamp(2rem, 4vw, 2.9rem); margin: 10px 0 18px; max-width: calc(100% - 150px); }
  .cover .eyebrow { color: var(--gold); font-weight: 600; font-size: .95rem; }
  .covermeta { display: flex; flex-wrap: wrap; gap: 10px 36px; margin: 0; }
  .covermeta dt { font-size: .82rem; color: #AFC0D6; }
  .covermeta dd { margin: 0; font-weight: 600; font-size: 1.02rem; }
  .explain { font-size: .94rem; color: var(--ink-2); background: var(--sunken); border-left: 3px solid var(--teal); padding: 10px 14px; margin: 0 0 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  @media (max-width: 640px) { .cover::after { display: none; } .cover h1 { max-width: none; } .cover { padding: 24px 20px; } }
  @media print {
    body { background: #fff; font-size: 11.5px; }
    .noprint { display: none !important; }
    .card { break-inside: avoid; border-color: #E0E5EB; }
    .wrap { max-width: none; padding: 0; }
    .cover, .cover::after, .secnum { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .tag, .banner, .bar .fill, th, .dim-letter { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pb { break-before: page; }
  }
</style>
